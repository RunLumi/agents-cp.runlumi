# Vendored `passkey-auth` 0.1.3 — see ../../docs/adr/0008-vendored-passkey-auth-wasm-clock.md
#
# This is the upstream crate, unmodified except for ONE function:
# `passkey_auth::types::now_secs`. The patch and its reason are recorded in
# `PATCHES.md` next to this file and in `docs/adr/0008-vendored-passkey-auth-wasm-clock.md`.
#
# Two deviations from the published `Cargo.toml`, both deliberate:
#
#   * `[dev-dependencies]`, `[[example]]`, and the tests directory are dropped.
#     The crate is consumed as a library, never built as a workspace member, so
#     its dev-only tree (axum, rocket, tokio, rusqlite with a bundled SQLite
#     amalgamation) is pure build cost and would be misleading in a repository
#     whose whole point is a bounded dependency surface.
#   * `js-sys` is added for `wasm32`. It is the only way to read the Workers
#     clock from Rust, and it is already in the graph through `wasm-bindgen` /
#     `worker`, so it adds no new code to the bundle.

[package]
edition     = "2024"
rust-version = "1.85"
name        = "passkey-auth"
version     = "0.1.3"
license     = "MIT OR Apache-2.0"
description = "Pure-Rust WebAuthn server library focused on passkeys (no openssl)."
repository  = "https://github.com/marirs/passkey-auth-rs"
readme      = "README.md"
keywords    = ["webauthn", "passkey", "fido2", "authentication"]
categories  = ["authentication", "cryptography"]
authors     = ["Sriram <marirs@gmail.com>"]

[lib]
name = "passkey_auth"
path = "src/lib.rs"

[dependencies]
# Crypto, all rustcrypto / pure-Rust. No openssl anywhere in the tree.
p256          = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
sha2          = "0.10"
rand          = "0.8"

# CBOR for COSE keys + attestationObject.
ciborium      = "0.2"

# Base64URL for credential IDs, challenges, raw byte fields on the wire.
base64        = "0.22"

# JSON for clientDataJSON parsing.
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# Error type.
thiserror     = "2"

# URL parsing for origin checks.
url           = "2"

# X.509 parsing for the `packed` (with x5c) and `fido-u2f` attestation
# formats. Pure-Rust, RustCrypto family - no openssl. We extract the
# leaf cert's SubjectPublicKey and any AAGUID extension; we do NOT
# validate the chain (see README scope note).
x509-cert     = { version = "0.2", features = ["std"] }
const-oid     = "0.9"

# PATCH: the Workers clock. `std::time::SystemTime::now()` is
# `unsupported()` on `wasm32-unknown-unknown` and panics, so ceremony
# timestamps could not be taken at all without it. Already in the graph
# through `wasm-bindgen`, so it costs no bundle size.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
