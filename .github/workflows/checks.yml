name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned pnpm and Node.js 24
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true

      - name: Install Rust and Worker WASM target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install workers-rs build tool
        run: cargo install --locked worker-build --version "^0.8"

      - name: Run formatting, lint, type, and unit checks
        run: pnpm check

      - name: Build web app and Worker dry run
        run: pnpm build

      - name: Apply migrations to a local D1
        run: pnpm --filter @runlumi/agents-cp-api db:migrations:apply:local

      - name: Prove the P08 structural invariants
        # The P08 probe is a schema check, not an HTTP smoke: it proves the
        # migration's triggers, CHECK constraints, and partial unique indexes
        # actually refuse what the domain says they refuse. `pnpm check` cannot
        # reach that, because it never opens D1.
        run: pnpm --filter @runlumi/agents-cp-api p08:invariants

      - name: Prove the passkey ceremonies on a real Worker
        # F01 makes passkeys the PRIMARY authentication method, and until
        # 2026-09-27 nothing here exercised a WebAuthn ceremony against a real
        # Worker. That gap hid two critical defects in `passkey-auth`: a clock
        # that panicked on wasm32, and a signature parser that rejected the
        # encoding WebAuthn actually specifies. Every ceremony endpoint returned
        # 500 while the unit tests, the WASM type check, and every other gate
        # were green. See docs/adr/0008-vendored-passkey-auth-wasm-clock.md.
        #
        # Self-contained: its own fresh local D1 and its own development Worker,
        # so it needs no service on :8787. It must run after `pnpm build`, so
        # that `wrangler dev` serves a prebuilt Worker instead of running a
        # release build inside the job.
        run: pnpm smoke:passkey

      - name: Install Chrome for the real-browser journey
        # The browser probe drives Chrome over the DevTools Protocol with no
        # Playwright/Puppeteer dependency, so it needs a Chrome to point at.
        # Without this step the probe exits 2 with "no Chrome/Chromium found",
        # which is deliberately distinct from a pass.
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Prove the real-browser journey
        # Promoted out of
        # `docs/verification/runs/2026-09-27-v00-independent-reconstruction/evidence/`
        # after it found four product defects no other gate could see: every
        # passkey endpoint 500ing, an email-verification step the UI could not
        # submit, a create-organization panel that was a one-way latch, and a
        # Members table that clipped its role control off a 390px screen.
        #
        # It needs two services: the Vite dev server (:5173) and the development
        # Worker (:8787), both started in the background. It is the only gate that
        # crosses a real DOM, a real WebAuthn authenticator, and a real layout, so
        # it is the only one that can catch that class of defect.
        run: |
          pnpm --filter @runlumi/agents-cp-api db:migrations:apply:local
          pnpm --filter @runlumi/agents-cp-web dev --port 5173 --strictPort &
          pnpm --filter @runlumi/agents-cp-api dev --port 8787 &
          # Wait for both to answer rather than sleeping a guessed interval.
          for i in $(seq 1 90); do
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/health || true)
            if [ "$web" = "200" ] && [ "$api" = "200" ]; then
              echo "both services are up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sS --fail http://localhost:8787/api/health
          curl -sS --fail -o /dev/null http://localhost:5173/
          pnpm smoke:browser
        # A stuck journey is a failing journey, not a slow one: the probe's own
        # per-condition timeouts plus this ceiling bound the step at roughly six
        # minutes, and the log is uploaded either way so a failure is diagnosable
        # from CI alone.
        timeout-minutes: 12
